<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96" role="img" aria-labelledby="seraTitle seraDesc">
  <title id="seraTitle">세라 SI Generator</title>
  <desc id="seraDesc">컴퓨터 작업을 하는 흰머리 연구원 세라의 10프레임 픽셀아트 애니메이션</desc>
  <style>
    .sera-frame {
      opacity: 0;
      animation: sera-frame-cycle 2.4s steps(1, end) infinite;
      image-rendering: pixelated;
    }
    .sera-frame-01 { animation-delay: 0s; }
    .sera-frame-02 { animation-delay: .24s; }
    .sera-frame-03 { animation-delay: .48s; }
    .sera-frame-04 { animation-delay: .72s; }
    .sera-frame-05 { animation-delay: .96s; }
    .sera-frame-06 { animation-delay: 1.20s; }
    .sera-frame-07 { animation-delay: 1.44s; }
    .sera-frame-08 { animation-delay: 1.68s; }
    .sera-frame-09 { animation-delay: 1.92s; }
    .sera-frame-10 { animation-delay: 2.16s; }
    @keyframes sera-frame-cycle {
      0%, 9.999% { opacity: 1; }
      10%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sera-frame { animation: none; opacity: 0; }
      .sera-frame-01 { opacity: 1; }
    }
  </style>
  <image class="sera-frame sera-frame-01" width="96" height="96" xlink:href="sera/sera-01.png" href="sera/sera-01.png" />
  <image class="sera-frame sera-frame-02" width="96" height="96" xlink:href="sera/sera-02.png" href="sera/sera-02.png" />
  <image class="sera-frame sera-frame-03" width="96" height="96" xlink:href="sera/sera-03.png" href="sera/sera-03.png" />
  <image class="sera-frame sera-frame-04" width="96" height="96" xlink:href="sera/sera-04.png" href="sera/sera-04.png" />
  <image class="sera-frame sera-frame-05" width="96" height="96" xlink:href="sera/sera-05.png" href="sera/sera-05.png" />
  <image class="sera-frame sera-frame-06" width="96" height="96" xlink:href="sera/sera-06.png" href="sera/sera-06.png" />
  <image class="sera-frame sera-frame-07" width="96" height="96" xlink:href="sera/sera-07.png" href="sera/sera-07.png" />
  <image class="sera-frame sera-frame-08" width="96" height="96" xlink:href="sera/sera-08.png" href="sera/sera-08.png" />
  <image class="sera-frame sera-frame-09" width="96" height="96" xlink:href="sera/sera-09.png" href="sera/sera-09.png" />
  <image class="sera-frame sera-frame-10" width="96" height="96" xlink:href="sera/sera-10.png" href="sera/sera-10.png" />
</svg>
